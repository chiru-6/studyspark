# One-click deploy on Render's free tier: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: studyspark
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "studyspark.app:app" --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
